<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WhatTheStack — Options</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial;margin:20px;color:#343a40}
    .row{margin-bottom:12px}
    label{display:block;margin-bottom:6px}
    input[type="text"], textarea{width:420px;max-width:100%;padding:8px;border-radius:8px;border:1px solid #d0d5dd}
    button{padding:8px 12px;border-radius:8px;border:1px solid #d0d5dd;background:#007bff;color:#fff}
  </style>
</head>
<body>
  <h1>WhatTheStack — Options</h1>
  <p>Configure detection behavior.</p>

  <div class="row">
    <label>
      Custom allowlist domains (comma-separated) — only analyze these if set:
      <input id="allowlist" type="text" placeholder="example.com, mysite.org" />
    </label>
  </div>

  <div class="row">
    <label>
      Exclude patterns (comma-separated substrings):
      <input id="exclude" type="text" placeholder="localhost, staging" />
    </label>
  </div>

  <button id="save">Save</button>
  <span id="status" style="margin-left:10px"></span>

  <script src="options.js"></script>
</body>
</html>
